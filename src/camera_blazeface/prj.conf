CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_REGULATOR=y

# C++ Support for TensorFlow Lite Micro
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

# External PSRAM (M5Stack CoreS3 has Quad SPI PSRAM)
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_SPIRAM_SPEED_80M=y
CONFIG_SPIRAM_TYPE_ESPPSRAM64=y
CONFIG_ESP_SPIRAM_SIZE=8388608
CONFIG_ESP_SPIRAM_MEMTEST=y

# Video Subsystem (GC0308 DVP Camera)
CONFIG_VIDEO=y
CONFIG_VIDEO_LOG_LEVEL_INF=y
CONFIG_VIDEO_INIT_PRIORITY=90
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=160000
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=1
CONFIG_VIDEO_BUFFER_POOL_ALIGN=32

# ESP32-S3 DMA and DVP
CONFIG_DMA=y
CONFIG_DMA_ESP32=y
CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=128

# Display Subsystem (ILI9342C SPI 40MHz)
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ILI9342C=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y

# Performance & Cache Optimizations
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_ESP32S3_DATA_CACHE_64KB=y
CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y

# Thread stack sizes
CONFIG_MAIN_STACK_SIZE=8192

# Boot delay (3 seconds) to allow PC USB host enumeration and terminal reconnection
CONFIG_BOOT_DELAY=3000
