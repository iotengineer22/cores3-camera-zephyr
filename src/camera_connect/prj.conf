CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_REGULATOR=y

# Video Subsystem
CONFIG_VIDEO=y
CONFIG_VIDEO_LOG_LEVEL_DBG=y
CONFIG_VIDEO_INIT_PRIORITY=90

# DMA and ESP32 LCD-CAM DVP
CONFIG_DMA=y
CONFIG_DMA_ESP32=y

# Main thread stack size
CONFIG_MAIN_STACK_SIZE=4096
