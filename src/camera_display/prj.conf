CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_REGULATOR=y

# Video Subsystem
CONFIG_VIDEO=y
CONFIG_VIDEO_LOG_LEVEL_INF=y
CONFIG_VIDEO_INIT_PRIORITY=90
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=308000
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_VIDEO_BUFFER_POOL_ALIGN=32

# ESP32-S3 DMA and DVP
CONFIG_DMA=y
CONFIG_DMA_ESP32=y
CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=128

# Display Subsystem (ILI9342C)
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ILI9342C=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y

# Main thread stack size
CONFIG_MAIN_STACK_SIZE=4096

# Boot delay (3 seconds) to allow PC USB host enumeration and terminal reconnection
CONFIG_BOOT_DELAY=3000

